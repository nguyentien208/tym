<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị & Tạo QR Code Tình Yêu ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- QR Code Styling Library & html2canvas -->
    <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        .admin-page {
            max-width: 1000px;
            margin: 30px auto;
            padding: 24px;
            background: rgba(23, 14, 21, 0.95);
            border: 1px solid rgba(244, 162, 175, 0.2);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
        }
        .admin-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .admin-header h1 {
            font-family: var(--font-heading);
            color: var(--color-rose);
            font-size: 2.4rem;
        }
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
        }
        @media (max-width: 850px) {
            .admin-grid { grid-template-columns: 1fr; }
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.88rem;
            color: var(--color-pink-soft);
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            font-family: var(--font-body);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 8px var(--color-primary-glow);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 60px;
        }
        .preview-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: rgba(13, 8, 12, 0.8);
            border-radius: 16px;
            padding: 24px 20px;
            border: 1px solid rgba(244, 162, 175, 0.2);
            text-align: center;
        }

        /* PREMIUM STYLIZED QR CONTAINER */
        .qr-card-wrapper {
            position: relative;
            margin: 20px 0;
            padding: 24px;
            background: linear-gradient(145deg, #1c0e18, #0d060b);
            border-radius: 24px;
            border: 1px solid rgba(244, 162, 175, 0.3);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 0 15px rgba(230, 57, 86, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        /* SVG Heart Frame Mask Overlay */
        .heart-frame-overlay {
            position: relative;
            display: inline-block;
            padding: 18px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        /* User Custom Heart Image Frame Container */
        .qr-card-wrapper.shape-heart .heart-frame-overlay {
            background: url('assets/images/ChatGPT_Image_21_57_31_14_thg_9__2026-removebg-preview.png') no-repeat center center / contain;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: none;
            border-radius: 0;
            box-shadow: none;
            overflow: visible;
        }

        .qr-card-wrapper.shape-heart .heart-frame-overlay::before,
        .qr-card-wrapper.shape-heart .heart-frame-overlay::after {
            display: none;
        }

        .qr-card-wrapper.shape-heart #qr-output {
            transform: scale(0.68);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 6px 20px rgba(230, 57, 86, 0.2);
            border: 2.5px solid rgba(244, 162, 175, 0.6);
            z-index: 2;
        }

        .qr-card-wrapper.shape-rounded .heart-frame-overlay {
            border-radius: 28px;
            border: 3px solid var(--color-rose);
        }

        .qr-card-wrapper.shape-square .heart-frame-overlay {
            border-radius: 8px;
            border: 2px solid var(--color-primary);
        }

        .link-output-box {
            width: 100%;
            word-break: break-all;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            color: var(--color-rose);
            margin-top: 10px;
            font-family: monospace;
            max-height: 80px;
            overflow-y: auto;
        }
        .btn-action-group {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .btn-action-group button {
            flex: 1;
            min-width: 100px;
            font-size: 0.88rem;
        }
        .tab-menu {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            color: var(--color-text-muted);
            padding: 8px 14px;
            font-size: 0.88rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background: var(--color-primary);
            color: #fff;
            box-shadow: 0 4px 12px var(--color-primary-glow);
        }
    </style>
</head>
<body>

    <div class="container admin-page">
        <div class="admin-header">
            <h1>❤️ Admin Tạo QR Quà Tặng Tình Yêu</h1>
            <p style="color: var(--color-text-sub); font-size: 0.9rem;">Tùy chỉnh thông điệp, giao diện, kiểu dáng & biểu tượng QR nghệ thuật</p>
        </div>

        <div class="admin-grid">
            <!-- Form Config Panel -->
            <div class="config-panel">
                <div class="tab-menu">
                    <button class="tab-btn active" onclick="switchTab('basic')">1. Cơ Bản</button>
                    <button class="tab-btn" onclick="switchTab('qrstyle')">2. Kiểu Dáng QR</button>
                    <button class="tab-btn" onclick="switchTab('music')">3. Nhạc Nền</button>
                    <button class="tab-btn" onclick="switchTab('content')">4. Lời Chúc</button>
                </div>

                <form id="admin-form">
                    <!-- Tab 1: Cơ bản -->
                    <div id="tab-basic" class="tab-content">
                        <div class="form-group">
                            <label>Tên bạn (Người gửi)</label>
                            <input type="text" id="cfg-boyfriend" class="form-control" value="Anh">
                        </div>
                        <div class="form-group">
                            <label>Tên bạn gái (Người nhận)</label>
                            <input type="text" id="cfg-girlfriend" class="form-control" value="Em">
                        </div>
                        <div class="form-group">
                            <label>Biệt danh thân mật</label>
                            <input type="text" id="cfg-nickname" class="form-control" value="Công chúa">
                        </div>
                        <div class="form-group">
                            <label>Ngày bắt đầu yêu</label>
                            <input type="date" id="cfg-startdate" class="form-control" value="2022-02-14">
                        </div>
                    </div>

                    <!-- Tab 2: Tùy chọn Kiểu Dáng QR Code -->
                    <div id="tab-qrstyle" class="tab-content hidden">
                        <div class="form-group">
                            <label>Kiểu khung thiết kế QR</label>
                            <select id="cfg-qr-shape" class="form-control">
                                <option value="rounded">✨ Khung Bo Tròn Sang Trọng (Mặc định chuẩn nhất)</option>
                                <option value="heart">❤️ Khung Trái Tim (Heart Frame)</option>
                                <option value="square">🔳 Khung Vuông Cổ Điển (Classic Square)</option>
                            </select>
                        <div class="form-group hidden" id="custom-heart-bg-group">
                            <label>Tải ảnh nền Trái Tim tùy chỉnh (PNG, JPG)</label>
                            <input type="file" id="cfg-custom-heart-bg-file" class="form-control" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label>Kích cỡ Mã QR Code (Tỉ lệ to / nhỏ)</label>
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <input type="range" id="cfg-qr-scale" min="0.4" max="0.9" step="0.02" value="0.68" class="form-control" style="flex: 1; padding: 0;">
                                <span id="qr-scale-val" style="color: var(--color-rose); font-weight: 600; font-size: 0.9rem; min-width: 45px;">68%</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Hình dạng chấm mã (Dots Style)</label>
                            <select id="cfg-qr-dots" class="form-control">
                                <option value="dots">🟢 Chấm Tròn Nổi Bật (Dots)</option>
                                <option value="rounded">🔷 Bo Góc Mềm Mại (Rounded)</option>
                                <option value="classy">💎 Kim Cương (Classy)</option>
                                <option value="square">⬛ Khối Vuông (Square)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Kích cỡ hạt chấm mã QR (Dot Size)</label>
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <input type="range" id="cfg-dot-size" min="160" max="320" step="20" value="240" class="form-control" style="flex: 1; padding: 0;">
                                <span id="dot-size-val" style="color: var(--color-rose); font-weight: 600; font-size: 0.9rem; min-width: 45px;">Mặt định</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Màu sắc mã QR</label>
                            <select id="cfg-qr-color" class="form-control">
                                <option value="#e63956">❤️ Đỏ Hồng Đỏ Rượu (Romantic Red)</option>
                                <option value="#801328">🍷 Đỏ Rượu Đậm (Wine Red)</option>
                                <option value="#0d080c">🖤 Đen Sang Trọng (Classic Dark)</option>
                                <option value="#c53455">💖 Hồng Rose Gold</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Icon chính giữa QR Code</label>
                            <select id="cfg-qr-icon" class="form-control">
                                <option value="heart">Trái tim đỏ ❤️</option>
                                <option value="custom">Tải ảnh từ máy... 🖼️</option>
                                <option value="none">Không dùng Icon</option>
                            </select>
                        </div>
                        <div class="form-group hidden" id="custom-icon-group">
                            <label>Tải ảnh Icon riêng (PNG, JPG)</label>
                            <input type="file" id="cfg-custom-icon-file" class="form-control" accept="image/*">
                        </div>
                    </div>

                    <!-- Tab 3: Nhạc & Phong cách -->
                    <div id="tab-music" class="tab-content hidden">
                        <div class="form-group">
                            <label>Chọn bản nhạc nền MP3</label>
                            <select id="cfg-music" class="form-control">
                                <option value="assets/music/love-song.mp3">Nhạc mặc định (Mellow Love)</option>
                                <option value="none">🔇 Không dùng nhạc nền (Tắt nhạc)</option>
                                <option value="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3">Piano lãng mạn (Romance)</option>
                                <option value="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3">Acoustic ngọt ngào</option>
                                <option value="custom">URL nhạc riêng (.mp3)...</option>
                            </select>
                        </div>
                        <div class="form-group hidden" id="custom-music-group">
                            <label>URL file nhạc MP3 tùy chỉnh</label>
                            <input type="url" id="cfg-custom-music" class="form-control" placeholder="https://example.com/song.mp3">
                        </div>
                    </div>

                    <!-- Tab 4: Lời chúc & Nội dung -->
                    <div id="tab-content" class="tab-content hidden">
                        <div class="form-group">
                            <label>Câu nói đặc biệt riêng của 2 người</label>
                            <textarea id="cfg-quote" class="form-control">Yêu em không phải là một lựa chọn, đó là điều tự nhiên nhất trong cuộc đời anh.</textarea>
                        </div>
                        <div class="form-group">
                            <label>Lời nhắn kết thúc (Màn Finale)</label>
                            <textarea id="cfg-final-msg" class="form-control">Cảm ơn em vì đã xuất hiện và làm cho mỗi ngày của anh trở nên ngập tràn ánh sáng.</textarea>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Preview & QR Generation Panel -->
            <div class="preview-panel">
                <h3 style="color: var(--color-pink-soft); font-family: var(--font-heading); font-size: 1.4rem;">Mã QR Xem Trước</h3>
                <p style="font-size: 0.8rem; color: var(--color-text-muted);">Quét mã QR bằng Camera điện thoại hoặc Zalo để mở món quà</p>

                <div id="qr-card-container" class="qr-card-wrapper shape-rounded">
                    <div class="heart-frame-overlay">
                        <div id="qr-output"></div>
                    </div>
                </div>

                <div class="link-output-box" id="generated-url-text">Đang khởi tạo link...</div>

                <div class="btn-action-group">
                    <button type="button" class="btn-primary" onclick="downloadQrImage()">📥 Tải Ảnh QR</button>
                    <button type="button" class="btn-primary" onclick="copyGeneratedUrl()">📋 Copy Link</button>
                    <button type="button" class="btn-secondary" onclick="openPreviewUrl()">👁️ Xem Thử</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let qrCodeStyling = null;
        let customIconDataUrl = "";

        const HEART_SVG_ICON = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23e63956"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));

            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.remove('hidden');
        }

        document.getElementById('cfg-music').addEventListener('change', (e) => {
            const customGroup = document.getElementById('custom-music-group');
            if (e.target.value === 'custom') {
                customGroup.classList.remove('hidden');
            } else {
                customGroup.classList.add('hidden');
            }
            updateQrCode();
        });

        let customHeartBgDataUrl = "";

        document.getElementById('cfg-qr-shape').addEventListener('change', (e) => {
            const customHeartGroup = document.getElementById('custom-heart-bg-group');
            if (e.target.value === 'heart') {
                customHeartGroup.classList.remove('hidden');
            } else {
                customHeartGroup.classList.add('hidden');
            }
            updateQrCode();
        });

        document.getElementById('cfg-custom-heart-bg-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    customHeartBgDataUrl = evt.target.result;
                    const overlay = document.querySelector('.heart-frame-overlay');
                    if (overlay) {
                        overlay.style.backgroundImage = `url('${customHeartBgDataUrl}')`;
                    }
                    updateQrCode();
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('cfg-qr-scale').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('qr-scale-val').textContent = Math.round(val * 100) + '%';
            const qrOutput = document.getElementById('qr-output');
            if (qrOutput) {
                qrOutput.style.transform = `scale(${val})`;
            }
        });

        document.getElementById('cfg-dot-size').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            let label = "Nhỏ";
            if (val === 240) label = "Mặc định";
            else if (val > 240) label = "To nổi";
            document.getElementById('dot-size-val').textContent = label;
            updateQrCode();
        });

        document.getElementById('cfg-custom-icon-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    customIconDataUrl = evt.target.result;
                    updateQrCode();
                };
                reader.readAsDataURL(file);
            }
        });

        function getBaseUrl() {
            const loc = window.location;
            let path = loc.pathname;
            if (path.endsWith('admin.html')) {
                path = path.substring(0, path.length - 'admin.html'.length);
            }
            return loc.protocol + '//' + loc.host + path;
        }

        function generateDataPayload() {
            const bf = document.getElementById('cfg-boyfriend').value || 'Anh';
            const gf = document.getElementById('cfg-girlfriend').value || 'Em';
            const nick = document.getElementById('cfg-nickname').value || 'Công chúa';
            const startDate = document.getElementById('cfg-startdate').value || '2022-02-14';

            let music = document.getElementById('cfg-music').value;
            if (music === 'custom') {
                music = document.getElementById('cfg-custom-music').value || 'assets/music/love-song.mp3';
            }

            const quote = document.getElementById('cfg-quote').value;
            const finalMsg = document.getElementById('cfg-final-msg').value;

            const payload = {
                b: bf, g: gf, n: nick, d: startDate, m: music, q: quote, f: finalMsg
            };

            // UTF-8 safe base64 encoding
            const jsonStr = JSON.stringify(payload);
            const bytes = new TextEncoder().encode(jsonStr);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        function updateQrCode() {
            const payload = generateDataPayload();
            const fullUrl = getBaseUrl() + '?d=' + payload;

            document.getElementById('generated-url-text').textContent = fullUrl;

            // QR Styles
            const shape = document.getElementById('cfg-qr-shape').value;
            const dotsStyle = document.getElementById('cfg-qr-dots').value;
            const qrColor = document.getElementById('cfg-qr-color').value;
            const iconOpt = document.getElementById('cfg-qr-icon').value;

            // Update wrapper shape & color CSS variable for heart dots pattern
            const wrapper = document.getElementById('qr-card-container');
            wrapper.className = 'qr-card-wrapper shape-' + shape;
            document.documentElement.style.setProperty('--qr-current-color', qrColor);

            const qrContainer = document.getElementById('qr-output');
            qrContainer.innerHTML = '';

            let iconImage = "";
            if (iconOpt === 'heart') {
                iconImage = HEART_SVG_ICON;
            } else if (iconOpt === 'custom' && customIconDataUrl) {
                iconImage = customIconDataUrl;
            }

            const dotSize = parseInt(document.getElementById('cfg-dot-size').value) || 240;

            const qrOptions = {
                width: dotSize,
                height: dotSize,
                type: "svg",
                data: fullUrl,
                image: iconImage,
                margin: 0,
                dotsOptions: {
                    color: qrColor,
                    type: dotsStyle
                },
                backgroundOptions: {
                    color: "#ffffff",
                },
                imageOptions: {
                    crossOrigin: "anonymous",
                    margin: 2,
                    imageSize: 0.2
                },
                cornersSquareOptions: {
                    color: qrColor,
                    type: "extra-rounded"
                },
                cornersDotOptions: {
                    color: qrColor,
                    type: "dot"
                },
                qrOptions: {
                    errorCorrectionLevel: 'H'
                }
            };

            qrCodeStyling = new QRCodeStyling(qrOptions);
            qrCodeStyling.append(qrContainer);
        }

        function downloadQrImage() {
            const shape = document.getElementById('cfg-qr-shape').value;
            const qrSvgEl = document.querySelector('#qr-output svg');
            const userScale = parseFloat(document.getElementById('cfg-qr-scale').value) || 0.68;
            
            if (shape === 'heart' && qrSvgEl) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const width = 800;
                const height = 800;
                canvas.width = width;
                canvas.height = height;

                // 1. Load Heart Background Image (Custom uploaded or default)
                const bgImg = new Image();
                bgImg.crossOrigin = "anonymous";
                bgImg.onload = function() {
                    ctx.drawImage(bgImg, 0, 0, width, height);

                    // 2. Load QR Code SVG
                    const svgString = new XMLSerializer().serializeToString(qrSvgEl);
                    const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                    const url = URL.createObjectURL(svgBlob);
                    const qrImg = new Image();

                    qrImg.onload = function() {
                        const qrSize = width * (userScale * 0.76);
                        const offset = (width - qrSize) / 2;

                        // Draw White Background Card behind QR
                        ctx.fillStyle = "#ffffff";
                        ctx.shadowColor = "rgba(230, 57, 86, 0.2)";
                        ctx.shadowBlur = 15;
                        ctx.beginPath();
                        if (ctx.roundRect) {
                            ctx.roundRect(offset - 12, offset - 12, qrSize + 24, qrSize + 24, 28);
                        } else {
                            ctx.rect(offset - 12, offset - 12, qrSize + 24, qrSize + 24);
                        }
                        ctx.fill();

                        // Draw QR Image
                        ctx.drawImage(qrImg, offset, offset, qrSize, qrSize);

                        // Trigger Download
                        const a = document.createElement('a');
                        a.download = 'love-qr-heart-frame.png';
                        a.href = canvas.toDataURL('image/png');
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    };
                    qrImg.src = url;
                };
                bgImg.onerror = function() {
                    if (qrCodeStyling) qrCodeStyling.download({ name: "love-qr-code", extension: "png" });
                };
                bgImg.src = customHeartBgDataUrl || 'assets/images/ChatGPT_Image_21_57_31_14_thg_9__2026-removebg-preview.png';
            } else {
                if (qrCodeStyling) {
                    qrCodeStyling.download({ name: "love-qr-code", extension: "png" });
                }
            }
        }

        function copyGeneratedUrl() {
            const urlText = document.getElementById('generated-url-text').textContent;
            navigator.clipboard.writeText(urlText).then(() => {
                alert('Đã sao chép đường dẫn quà tặng!');
            });
        }

        function openPreviewUrl() {
            const urlText = document.getElementById('generated-url-text').textContent;
            window.open(urlText, '_blank');
        }

        // Live update on input changes
        document.querySelectorAll('.form-control').forEach(el => {
            el.addEventListener('input', updateQrCode);
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            updateQrCode();
        });
    </script>
</body>
</html>
